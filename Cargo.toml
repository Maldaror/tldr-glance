[package]
name = "tldr-glance"
version = "0.1.0"
edition = "2024"
description = "Terminal-UI zum schnellen Scannen der TLDR-Newsletter"
license = "MIT"
repository = "https://github.com/maldaror/tldr-glance"
authors = ["Mike Pinkert"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
scraper = "0.27"
url = "2"
toml = "1.1"
dirs = "7"
